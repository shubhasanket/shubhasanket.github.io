- title: Selected Projects
  type: time_table
  contents:
    - title: Feynman-Kac Based PDE Solver using Machine Learning
      year: Feb 2025 - May 2025
      description:
        - Developed a neural network-based PDE solver using the Feynman–Kac formula; applied it to the Black–Scholes equation for pricing European options.
        - Conducted a systematic performance comparison with classical methods such as Finite Difference and Monte Carlo approaches, evaluating both accuracy and computational efficiency.
    - title: Auto-Encoder with Regression for Time Series Anomaly Detection
      year: Oct 2025 - Jan 2026
      description:
        - Implemented the Auto-Encoder with Regression framework for time series anomaly detection in PyTorch.
        - Extended post-processing with alternative thresholding strategies and ensured compatibility with recent Python versions, unlike the TensorFlow-based orion-ml reference.
    - title: Deep Learning-Based Volatility Forecasting
      year: Nov 2025 - Jan 2026
      description:
        - Implemented deep learning volatility forecasters using realized volatility, daily returns and other parameters.
        - Built a symbol-aware time-series pipeline on the Oxford–Man Realized Volatility dataset and evaluated models using MSE, QLIKE, and directional accuracy.
    - title: Fitting a Stochastic Differential Equation to the Lorenz Trajectory
      year: May 2025 - Jul 2025
      description:
        - Developed stochastic differential equation (SDE) models to approximate the dynamics of the Lorenz system.
        - Validated model performance by analyzing the trade-off between complexity, stability, and fidelity of the reproduced dynamics.

